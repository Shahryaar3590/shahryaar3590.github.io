<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>آینهٔ دسترسی‌های مرورگر</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>آینهٔ دسترسی‌های مرورگر</h1>
    <p>بررسی، درخواست و نمایش وضعیت مجوزها</p>
  </header>

  <main>
    <section id="permissions">
      <h2>مجوزها</h2>
      <div id="permList"></div>
    </section>

    <section id="actions">
      <h2>درخواست‌ها</h2>
      <button onclick="requestGeo()">موقعیت</button>
      <button onclick="requestClipboard()">کلیپ‌بورد</button>
      <button onclick="requestCamera()">دوربین</button>
    </section>

    <section id="systemInfo">
      <h2>اطلاعات سیستم مرورگر</h2>
      <button onclick="showSystemInfo()">بررسی سیستم من</button>
      <div id="infoOutput" style="margin-top:10px; font-family:monospace;"></div>
    </section>

    <section id="export">
      <h2>صادرات</h2>
      <button onclick="exportStatus()">ذخیره وضعیت</button>
    </section>
  </main>

  <footer>
    <p>ساخته شده توسط shahryaar3590</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
