<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Main - واکنش‌گرا و دسترسی‌های جداگانه</title>
<style>
:root{
  --bg1:#071226;
  --accent1:#00d4ff;
  --accent2:#ff5edf;
  --glass:rgba(255,255,255,0.03);
  --text-transparent:rgba(255,255,255,0.75);
}
html,body{height:100%;margin:0;font-family:'Segoe UI', Roboto, Helvetica, 'Noto Naskh Arabic UI', sans-serif;background:var(--bg1);color:white;direction:rtl;}
.stage{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:2vw;}
.core{position:relative;z-index:4;display:grid;place-items:center;width:90vw;max-width:1000px;height:85vh;max-height:900px;border-radius:2vw;overflow:hidden;padding:2vw;backdrop-filter: blur(4px) saturate(1.2);box-shadow:0 5vw 10vw rgba(0,0,0,0.5);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:0.2vw solid rgba(255,255,255,0.04);}
.status-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;padding:2vw;border-radius:1vw;background:rgba(0,0,0,0.32);color:var(--text-transparent);font-family:monospace;font-size:clamp(12px,1.5vw,18px);white-space:pre-line;text-align:right;max-width:90%;max-height:80%;overflow:auto;pointer-events:none}
.btn{background:linear-gradient(90deg,var(--accent1),var(--accent2));padding:1vw 2vw;border-radius:1vw;border:none;color:#071226;font-weight:700;font-size:clamp(14px,1.5vw,18px);cursor:pointer;box-shadow:0 0.5vw 2vw rgba(0,0,0,0.5),0 0.2vw 0.5vw rgba(0,0,0,0.25);margin:0.5vw 0;display:flex;align-items:center;justify-content:flex-start;}
.btn span{margin-left:0.5vw;}
.permission-container{display:grid;gap:0.5vw;margin-bottom:1.5vw;width:100%;}
@media (max-width:600px){
  .core{width:95vw;height:90vh;padding:4vw;border-radius:4vw;}
  .status-panel{font-size:clamp(10px,2.5vw,14px);padding:3vw;}
  .btn{padding:3vw;font-size:clamp(12px,3vw,16px);border-radius:2vw;}
  .btn span{margin-left:1vw;}
}
</style>
</head>
<body>
<div class="stage">
<div class="core">
<div class="permission-container">
<button class="btn" id="geoBtn"><span>📍</span> فعال کردن Geolocation</button>
<button class="btn" id="camBtn"><span>📷</span> فعال کردن Camera</button>
<button class="btn" id="micBtn"><span>🎤</span> فعال کردن Microphone</button>
<button class="btn" id="notifBtn"><span>🔔</span> فعال کردن Notifications</button>
<button class="btn" id="clipBtn"><span>📋</span> فعال کردن Clipboard</button>
</div>
<div class="status-panel" id="statusPanel">در حال بارگذاری اطلاعات...</div>
</div>
</div>
<script>
const statusPanel=document.getElementById('statusPanel');
async function getPublicIP(){
  try{
    let res=await fetch('https://api.ipify.org?format=json');
    let data=await res.json();
    return data.ip;
  }catch(e){return 'نامعلوم';}
}
function getCanvasFingerprint(){
  let canvas=document.createElement('canvas');
  let ctx=canvas.getContext('2d');
  ctx.textBaseline='top';ctx.font='16px Arial';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#f60';ctx.fillRect(125,1,62,20);
  ctx.fillStyle='#069';ctx.fillText('FingerprintTest', 2, 15);
  ctx.fillStyle='rgba(102, 204, 0, 0.7)';ctx.fillText('FingerprintTest', 4, 17);
  let fp=canvas.toDataURL();
  return fp.substring(0,30)+'...';
}
function getAudioFingerprint(){
  try{
    const audioCtx=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,44100,44100);
    const oscillator=audioCtx.createOscillator();
    oscillator.type='triangle';oscillator.frequency.setValueAtTime(10000,audioCtx.currentTime);
    const compressor=audioCtx.createDynamicsCompressor();
    oscillator.connect(compressor);compressor.connect(audioCtx.destination);
    oscillator.start(0);
    return audioCtx.startRendering().then(buffer=>{
      return buffer.getChannelData(0).slice(0,10).join(',')+'...';
    }).catch(()=> 'نامعلوم');
  }catch(e){return Promise.resolve('نامعلوم');}
}

let perms={geo:'denied',cam:'denied',mic:'denied',notif:'denied',clip:'denied'};

async function updateInfo(){
  const battery=await navigator.getBattery().catch(()=>null);
  const connection=navigator.connection||navigator.mozConnection||navigator.webkitConnection||{};
  const publicIP=await getPublicIP();
  const canvasFP=getCanvasFingerprint();
  const audioFP=await getAudioFingerprint();

  const info=`🌐 زبان: ${navigator.language}
💻 پلتفرم: ${navigator.platform}
🖥️ رزولوشن: ${screen.width}x${screen.height}, DPI: ${window.devicePixelRatio}
⚙️ CPU هسته‌ها: ${navigator.hardwareConcurrency}
💾 حافظه: ${navigator.deviceMemory||'نامعلوم'} GB
🔋 باتری: ${battery?Math.round(battery.level*100)+'%':''} ${battery?(battery.charging?'(در حال شارژ)':'(در حال استفاده)') :''}
🌐 IP عمومی: ${publicIP}
🖌️ Canvas Fingerprint: ${canvasFP}
🔊 Audio Fingerprint: ${audioFP}
📶 شبکه: ${connection.effectiveType||'نامعلوم'}

--- مجوزها ---
Geolocation: ${perms.geo}
Camera: ${perms.cam}
Microphone: ${perms.mic}
Notifications: ${perms.notif}
Clipboard: ${perms.clip}

--- User Agent ---
${navigator.userAgent}`;
  console.clear();
  console.table({status: info.split('\n')});
  statusPanel.textContent=info;
}

geoBtn.addEventListener('click',()=>{
  navigator.geolocation.getCurrentPosition(()=>{perms.geo='granted'; updateInfo();},()=>{perms.geo='denied'; updateInfo();});
});
camBtn.addEventListener('click',async()=>{
  try{let stream=await navigator.mediaDevices.getUserMedia({video:true}); perms.cam='granted'; stream.getTracks().forEach(t=>t.stop()); updateInfo();}catch(e){perms.cam='denied'; updateInfo();}
});
micBtn.addEventListener('click',async()=>{
  try{let stream=await navigator.mediaDevices.getUserMedia({audio:true}); perms.mic='granted'; stream.getTracks().forEach(t=>t.stop()); updateInfo();}catch(e){perms.mic='denied'; updateInfo();}
});
notifBtn.addEventListener('click',async()=>{
  try{let perm=await Notification.requestPermission(); perms.notif=perm; updateInfo();}catch(e){perms.notif='denied'; updateInfo();}
});
clipBtn.addEventListener('click',async()=>{
  try{await navigator.clipboard.readText(); perms.clip='granted'; updateInfo();}catch(e){perms.clip='denied'; updateInfo();}
});

updateInfo();
</script>
</body>
</html>
