<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>آینهٔ دسترسی‌های مرورگر</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>آینهٔ دسترسی‌های مرورگر</h1>
    <p>بررسی، درخواست و نمایش وضعیت مجوزها و اطلاعات سیستم</p>
  </header>

  <main>
    <section id="permissions">
      <h2>مجوزها</h2>
      <div id="permList"></div>
    </section>

    <section id="actions">
      <h2>درخواست‌ها</h2>
      <button onclick="requestGeo()">موقعیت</button>
      <button onclick="requestClipboard()">کلیپ‌بورد</button>
      <button onclick="requestCamera()">دوربین</button>
      <video id="cameraView" autoplay playsinline width="320" height="240" style="margin-top:10px;"></video>
    </section>

    <section id="systemInfo">
      <h2>اطلاعات سیستم مرورگر</h2>
      <button onclick="showSystemInfo()">بررسی سیستم من</button>
      <div id="infoOutput" style="margin-top:10px; font-family:monospace;"></div>
    </section>

    <section id="export">
      <h2>صادرات</h2>
      <button onclick="exportStatus()">ذخیره وضعیت</button>
    </section>
  </main>

    <div style="text-align:center; margin-top:20px;">
        <a href="index-v2.html" style="display:inline-block; padding:10px 20px; background:#667eea; color:white; text-decoration:none; border-radius:5px;">
            🚀 رفتن به نسخه پیشرفته
        </a>
    </div>
  <footer>
    <p>ساخته شده توسط shahryaar3590</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
