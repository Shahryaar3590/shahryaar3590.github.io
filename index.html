<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>آینهٔ دسترسی‌های مرورگر</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style-v2.css">
    <style>
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            color: white;
            margin: 2rem auto;
            max-width: 800px;
        }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero p { font-size: 1.2rem; opacity: 0.9; }
        .cta-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 1.5rem;
            transition: transform 0.3s;
        }
        .cta-btn:hover { transform: scale(1.05); }
        .footer { text-align: center; margin-top: 2rem; color: var(--muted); }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>🔍 آینهٔ دسترسی‌های مرورگر</h1>
            <p>بررسی، درخواست و نمایش وضعیت مجوزها و اطلاعات سیستم</p>
            <a href="Main.html" class="cta-btn">🚀 رفتن به نسخه پیشرفته</a>
        </div>
        <div class="footer">
            <small>ساخته شده توسط shahryaar3590</small>
        </div>
    </div>
</body>
</html>
